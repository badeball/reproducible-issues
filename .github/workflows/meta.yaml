name: import.meta

on: [push]

defaults:
  run:
    working-directory: cypress/meta

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["^14", "~15.0", "~15.1", "~15.2", "~15.3", "~15.4", "~15.5", "~15.6", "~15.7", "~15.8", "~15.9", "~15.10", "~15.11", "~15.12", "~15.13", "~15.14", "~15.15", "~15.16", "~15.17", "~15.18", "~15.19", "~15.20", "~15.21"]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Cypress
        shell: bash
        run: npm install cypress@${{ matrix.version }}
      - name: Cypress version
        run: npx cypress -v
      - name: Test
        run: npx cypress run
