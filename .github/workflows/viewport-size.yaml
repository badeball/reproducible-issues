name: Viewport size

on: [push]

defaults:
  run:
    working-directory: cypress/viewport-size

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependencies
        shell: bash
        run: npm install --engine-strict
      - name: Test
        run: npx cypress run

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependencies
        shell: bash
        run: npm install --engine-strict
      - name: Test
        run: npx cypress run
